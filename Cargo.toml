[package]
name = "oas2client"
version = "0.1.0"
edition = "2024"
description = "OpenAPI client generator with exchangeable Mustache and Jinja templates, compatible with openapi-generator"
license = "Apache-2.0"
repository = "https://github.com/dhufnagel/oas2client"
authors = ["Dominik Hufnagel <mail@dominik-hufnagel.de>"]
readme = "README.md"
keywords = ["openapi", "codegen", "generator", "typescript", "java"]
categories = ["command-line-utilities", "development-tools"]

[profile.release]
lto = true
codegen-units = 1
strip = true

[dependencies]
include_dir = "0.7.4"
minijinja = { version = "3.1.0", features = ["json", "serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
toml = "1.2.1"
